<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rumo à UFBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: folha de respostas de concurso — faixa de navegação fixa, colunas de estudo, bolhas A–E como linguagem visual. */
:root{
  --bg:#f3f5f8; --paper:#ffffff; --ink:#14213a; --muted:#5a6680; --line:#d9dee8; --soft:#e9edf4;
  --accent:#1f4fd1; --accent-ink:#ffffff; --mark:#ffe169; --mark-ink:#3b3000;
  --ok:#1a7f4b; --ok-bg:#e3f4ea; --bad:#b4232c; --bad-bg:#fbe5e6; --warn:#a15c00; --warn-bg:#fff1d6;
  --c-port:#7a3fc2; --c-info:#0a7f8c; --c-ap:#c2410c; --c-esp:#1f4fd1; --c-red:#a2286b;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1422; --paper:#161e30; --ink:#e7ecf6; --muted:#9aa6bf; --line:#2a3550; --soft:#1d2740;
  --accent:#7d9dff; --accent-ink:#0b1326; --mark:#f5d547; --mark-ink:#2a2200;
  --ok:#56d08f; --ok-bg:#12321f; --bad:#ff7b84; --bad-bg:#3a161b; --warn:#ffbe5c; --warn-bg:#3a2a10;
  --c-port:#b48cff; --c-info:#4fd0dc; --c-ap:#ff9a5c; --c-esp:#7d9dff; --c-red:#f07ab8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1422; --paper:#161e30; --ink:#e7ecf6; --muted:#9aa6bf; --line:#2a3550; --soft:#1d2740;
  --accent:#7d9dff; --accent-ink:#0b1326; --mark:#f5d547; --mark-ink:#2a2200;
  --ok:#56d08f; --ok-bg:#12321f; --bad:#ff7b84; --bad-bg:#3a161b; --warn:#ffbe5c; --warn-bg:#3a2a10;
  --c-port:#b48cff; --c-info:#4fd0dc; --c-ap:#ff9a5c; --c-esp:#7d9dff; --c-red:#f07ab8; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topo */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:.85rem}
.brand h1{white-space:nowrap}
@media (max-width:520px){.brand small{display:none}}
.count{font-family:var(--f-mono);font-size:.85rem;background:var(--mark);color:var(--mark-ink);padding:3px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
.sync{font-size:.78rem;color:var(--muted);white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:999px;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
nav.tabs button:hover:not([aria-selected="true"]){background:var(--soft);color:var(--ink)}
main{padding-block:20px 60px}
section[hidden]{display:none}

/* blocos */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c, var(--accent));display:inline-block}
.mono{font-family:var(--f-mono)}
.hl{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:3px}

/* hoje */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.dayhead{display:flex;align-items:flex-start;gap:14px}
.datebox{font-family:var(--f-mono);border:2px solid var(--ink);border-radius:8px;text-align:center;min-width:64px;padding:4px 6px;line-height:1.1}
.datebox b{display:block;font-size:1.6rem}
.datebox span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.dayhead h2{font-size:1.45rem}
.tasks{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.task{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 6px;border-radius:8px}
.task:hover{background:var(--soft)}
.task input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ok)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .tt{min-width:0}
.task .min{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap;padding-top:2px}
.task .go{font-size:.85rem}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--ok);border-radius:99px}
.weights{display:flex;flex-direction:column;gap:10px}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:.92rem}
.wrow .bar{grid-column:1/-1;height:10px}
.wrow .bar>span{background:var(--c)}
.note{border-left:4px solid var(--mark);background:var(--soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.93rem}

/* cronograma */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:.72rem;text-align:center;color:var(--muted);font-weight:700;text-transform:uppercase}
.cell{min-height:92px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell.empty{background:transparent;border-style:dashed;opacity:.5}
.cell .n{font-family:var(--f-mono);font-size:.8rem;font-weight:600;display:flex;justify-content:space-between}
.cell .f{font-size:.78rem;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.cell.today{border:2px solid var(--accent)}
.cell.exam{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cell.sim .f{font-weight:700}
.cell .pbar{margin-top:auto;height:4px;background:var(--soft);border-radius:4px;overflow:hidden}
.cell .pbar span{display:block;height:100%;background:var(--ok)}
@media (max-width:620px){.cal{grid-template-columns:1fr}.cal .dow,.cell.empty{display:none}.cell{min-height:0}}

/* flashcards */
.flash{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card3d{perspective:1200px;min-height:260px}
.card3d .inner{position:relative;width:100%;min-height:260px;transition:transform .45s;transform-style:preserve-3d}
.card3d.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:12px;box-shadow:0 6px 0 var(--soft)}
.face.back{transform:rotateY(180deg);border-color:var(--accent)}
.face .q{font-family:var(--f-display);font-size:1.35rem;font-weight:700;text-wrap:balance}
.face .a{font-size:1.12rem}
@media (prefers-reduced-motion:reduce){.card3d .inner{transition:none}}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rate button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 4px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.rate button small{font-weight:400;color:var(--muted);font-size:.75rem}
.rate .r0{border-color:var(--bad);color:var(--bad)}
.rate .r1{border-color:var(--warn);color:var(--warn)}
.rate .r2{border-color:var(--ok);color:var(--ok)}
.rate .r3{border-color:var(--accent);color:var(--accent)}
.boxes{display:flex;gap:6px;align-items:flex-end;height:70px}
.boxes div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.boxlbl{display:flex;gap:6px}.boxlbl span{flex:1;text-align:center;font-size:.7rem;color:var(--muted)}

/* simulado */
.simgrid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
@media (max-width:820px){.simgrid{grid-template-columns:1fr}}
.qtext{font-size:1.08rem}
.alts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.alt{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px}
.alt:hover{border-color:var(--ink)}
.bub{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.9rem}
.alt.sel .bub{background:var(--ink);color:var(--paper)}
.alt.right{border-color:var(--ok);background:var(--ok-bg)}
.alt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.alt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.alt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.expl{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--soft);font-size:.95rem}
.sheet{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.sheet button{border:1px solid var(--line);background:var(--paper);border-radius:6px;font-family:var(--f-mono);font-size:.78rem;padding:5px 0}
.sheet button.ans{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sheet button.cur{outline:2px solid var(--accent);outline-offset:1px}
.sheet button.okq{background:var(--ok);color:var(--paper);border-color:var(--ok)}
.sheet button.errq{background:var(--bad);color:var(--paper);border-color:var(--bad)}
.timer{font-family:var(--f-mono);font-size:1.6rem;font-weight:600}
.opt{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--paper);display:flex;flex-direction:column;gap:8px;text-align:left}
.opt h3{font-size:1.1rem}
.opt.reco{border:2px solid var(--accent)}
.res-big{font-family:var(--f-display);font-size:2.6rem;font-weight:800;line-height:1}
table.t{width:100%;border-collapse:collapse;font-size:.93rem}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}

/* resumos */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-weight:600;font-size:.88rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
details.topic{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);border-left:5px solid var(--c)}
details.topic>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:10px;align-items:center}
details.topic>summary::-webkit-details-marker{display:none}
details.topic>summary h3{font-size:1.05rem;flex:1;min-width:0}
details.topic .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
details.topic ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.mnem{background:var(--mark);color:var(--mark-ink);border-radius:10px;padding:12px 14px}
.mnem b{font-family:var(--f-display);font-size:1.15rem;display:block}
.cloze{display:flex;flex-direction:column;gap:8px}
.cloze p{margin:0;padding:10px 12px;background:var(--soft);border-radius:8px}
.blank{border:0;border-bottom:2px dashed var(--accent);background:transparent;color:transparent;padding:0 4px;min-width:60px;border-radius:0}
.blank.show{color:var(--accent);font-weight:700;border-bottom-style:solid}
.done-badge{color:var(--ok);font-weight:700;font-size:.82rem}

/* redação */
.crit{display:grid;grid-template-columns:minmax(0,1fr) 60px;gap:6px 12px;align-items:center}
.crit .pts{font-family:var(--f-mono);font-weight:600;text-align:right}
textarea.redac{width:100%;min-height:380px;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--line) 31px,var(--line) 32px);line-height:32px;resize:vertical}
.lines{font-family:var(--f-mono);font-weight:600}
.lines.bad{color:var(--bad)} .lines.ok{color:var(--ok)}
input[type=range]{width:100%;accent-color:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
textarea.code{width:100%;min-height:90px;font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--soft)}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="row">
      <div class="brand"><h1>Rumo à UFBA</h1><small>Assistente em Administração · Pedro</small></div>
      <span class="sync" id="sync">Carregando…</span>
      <span class="count" id="countdown">—</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Seções">
      <button role="tab" data-tab="hoje" aria-selected="true">Hoje</button>
      <button role="tab" data-tab="cronograma">Cronograma</button>
      <button role="tab" data-tab="flashcards">Flashcards</button>
      <button role="tab" data-tab="simulados">Questões e simulados</button>
      <button role="tab" data-tab="resumos">Resumos e mnemônicos</button>
      <button role="tab" data-tab="redacao">Redação</button>
      <button role="tab" data-tab="desempenho">Desempenho</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="tab-hoje"><div class="empty">Carregando o plano de estudos…</div></section>
  <section id="tab-cronograma" hidden></section>
  <section id="tab-flashcards" hidden></section>
  <section id="tab-simulados" hidden></section>
  <section id="tab-resumos" hidden></section>
  <section id="tab-redacao" hidden></section>
  <section id="tab-desempenho" hidden></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
const EXAM = "2026-12-20", START = "2026-11-30", LAST = "2026-12-19";
const COR = {port:"var(--c-port)", info:"var(--c-info)", ap:"var(--c-ap)", esp:"var(--c-esp)", red:"var(--c-red)"};
const SIGLA = {port:"Português", info:"Informática", ap:"Adm. Pública", esp:"Específicos"};
const DOW = ["dom","seg","ter","qua","qui","sex","sáb"];
const MES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const INTERVAL = [0,1,2,4,7,12];
const LS_KEY = "rumo-ufba-pedro-v1";
let D = null;               // conteúdo
let S = null;               // estado/progresso
let T = {};                 // índices
let db = null, docRef = null, saveTimer = null, saving = false, pendingSave = false;

// ---------- utilidades ----------
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function diffDays(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function fmtDate(s,long){ const d=parseISO(s); return long ? DOW[d.getDay()]+", "+d.getDate()+" de "+MES[d.getMonth()] : pad(d.getDate())+"/"+pad(d.getMonth()+1); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),2200); }
function matOf(tp){ return T.top[tp] ? T.top[tp].m : "esp"; }
function chip(m,label){ return '<span class="chip" style="--c:'+COR[m]+'"><i></i>'+esc(label||SIGLA[m]||m)+'</span>'; }
const LETRAS = ["A","B","C","D","E"];

// ---------- estado ----------
function blankState(){ return {v:1, updatedAt:0, tasks:{}, cards:{}, qstats:{}, sims:[], lido:{}, redacoes:[], liberarTudo:false}; }
function loadLocal(){ try{ const r=localStorage.getItem(LS_KEY); if(r) return JSON.parse(r); }catch(e){} return null; }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function setSync(txt){ $("#sync").textContent = txt; }
function touch(){
  S.updatedAt = Date.now(); saveLocal();
  clearTimeout(saveTimer); saveTimer = setTimeout(pushRemote, 1500);
}
async function pushRemote(){
  if(!docRef){ setSync("Salvo neste navegador"); return; }
  if(saving){ pendingSave = true; return; }
  saving = true; setSync("Salvando…");
  try{ await docRef.set({estado: JSON.stringify(S), updatedAt: S.updatedAt}); setSync("Progresso salvo na nuvem"); }
  catch(e){ setSync("Salvo neste navegador"); }
  saving = false;
  if(pendingSave){ pendingSave=false; pushRemote(); }
}
async function connectRemote(){ setSync("Salvo neste navegador"); }

// ---------- calendário / desbloqueio ----------
function curDay(){ const t=todayISO(); if(t<START) return START; if(t>LAST) return LAST; return t; }
function dayOfTopic(tp){ return T.topDay[tp] || START; }
function topicUnlocked(tp){ return S.liberarTudo || S.lido[tp] || dayOfTopic(tp) <= todayISO(); }
function unlockedTopics(){ return D.topicos.filter(t=>topicUnlocked(t.id)).map(t=>t.id); }
function simOfDay(d){ return {"2026-12-05":{n:30,min:105,nome:"Simulado 1"},"2026-12-12":{n:40,min:140,nome:"Simulado 2"},"2026-12-17":{n:60,min:240,nome:"Simulado 3 (prova completa)",full:true}}[d]; }

function dayTasks(day){
  const tasks=[];
  day.tps.forEach(tp=>{
    const t=T.top[tp];
    tasks.push({id:"r:"+tp, txt:"Estudar o resumo e completar as lacunas: "+t.t, m:t.m, min:40, go:{tab:"resumos",tp}});
  });
  if(day.tps.length){
    tasks.push({id:"c:"+day.d, txt:"Flashcards: revisar os pendentes e aprender os novos de hoje", m:null, min:20, go:{tab:"flashcards"}});
    tasks.push({id:"q:"+day.d, txt:"Treino rápido: 10 questões dos tópicos de hoje", m:null, min:25, go:{tab:"simulados",treinoDia:day.d}});
  }
  const sim=simOfDay(day.d);
  day.extra.forEach((x,i)=>{
    const t={id:"x"+i+":"+day.d, txt:x, m:null, min:null};
    if(/^Simulado/.test(x) && sim) { t.go={tab:"simulados",simDia:day.d}; t.min=sim.min; }
    else if(/Diagnóstico/.test(x)) { t.go={tab:"simulados",diag:true}; t.min=20; }
    else if(/^Redação/.test(x)) { t.go={tab:"redacao"}; t.min=60; }
    else if(/^Treino/.test(x)) { t.go={tab:"simulados"}; t.min=20; }
    else if(/Caderno de erros|Refaça/.test(x)) { t.go={tab:"simulados",erros:true}; }
    else if(/flashcards/i.test(x)) { t.go={tab:"flashcards"}; }
    else if(/mnemônicos/.test(x)) { t.go={tab:"resumos",mnem:true}; }
    tasks.push(t);
  });
  return tasks;
}

function cardState(id){ return S.cards[id]; }
function dueCards(){
  const t=todayISO(), un=new Set(unlockedTopics());
  const due=[], novos=[];
  D.cards.forEach(c=>{
    if(!un.has(c.tp)) return;
    const st=cardState(c.id);
    if(!st) novos.push(c); else if(st.due<=t) due.push(c);
  });
  return {due, novos};
}
function rateCard(c, r){
  const t=todayISO(); const st=S.cards[c.id] || {box:0, reps:0, lapses:0};
  st.reps++;
  if(r===0){ st.box=0; st.lapses++; st.due=t; }
  else {
    if(r===1) st.box=Math.max(1, st.box);
    if(r===2) st.box=Math.min(5, st.box+1);
    if(r===3) st.box=Math.min(5, st.box+2);
    let due = addDays(t, INTERVAL[st.box]);
    if(due>LAST && t<LAST) due = LAST;      // tudo volta antes da prova
    st.due = due;
  }
  st.last=t; S.cards[c.id]=st; touch();
}

let SIM=null; // {nome, qs:[ids], ans:{}, idx, mode:'prova'|'treino', start, limitMin, done, full}
function pickQuestions(n, tps, opts={}){
  const allow=new Set(tps);
  let pool=D.questoes.filter(q=>allow.has(q.tp));
  if(pool.length<n) pool=D.questoes.slice();
  const unseen=q=>!S.qstats[q.id];
  if(opts.prop){
    const quota={esp:30,ap:12,port:12,info:6}; const tot=60; const out=[];
    Object.keys(quota).forEach(m=>{
      const k=Math.round(quota[m]*n/tot);
      const pm=pool.filter(q=>matOf(q.tp)===m);
      const ord=shuffle(pm.filter(unseen)).concat(shuffle(pm.filter(q=>!unseen(q))));
      out.push(...ord.slice(0,k));
    });
    if(out.length<n){ const rest=shuffle(pool.filter(q=>!out.includes(q))); out.push(...rest.slice(0,n-out.length)); }
    const order=["port","info","ap","esp"];
    return out.slice(0,n).sort((a,b)=>order.indexOf(matOf(a.tp))-order.indexOf(matOf(b.tp))).map(q=>q.id);
  }
  return shuffle(pool.filter(unseen)).concat(shuffle(pool.filter(q=>!unseen(q)))).slice(0,n).map(q=>q.id);
}

function simScore(ids, ans){
  const by={}; let ok=0, pts=0, max=0;
  ids.forEach(id=>{const q=T.q[id]; const m=matOf(q.tp); const w=m==="esp"?2:1; by[m]=by[m]||{ok:0,n:0}; by[m].n++; max+=w; if(ans[id]===q.c){ok++;pts+=w;by[m].ok++;}});
  return {ok, pts, max, by};
}

}

// ---------- navegação ----------
let curTab="hoje";
function showTab(name){
  curTab=name;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===name));
  document.querySelectorAll("main>section").forEach(s=>s.hidden = s.id!=="tab-"+name);
  renderTab(name);
  try{ localStorage.setItem(LS_KEY+"-tab", name); }catch(e){}
}
function renderTab(n){
  ({hoje:renderHoje, cronograma:renderCrono, flashcards:renderFlash, simulados:renderSim, resumos:renderResumos, redacao:renderRedacao, desempenho:renderDesemp})[n]();
}
function renderAll(){ renderTab(curTab); updCount(); }
function updCount(){ const n=diffDays(todayISO(),EXAM); $("#countdown").textContent = n>0 ? n+" dias para a prova" : (n===0?"Hoje é a prova":"Prova realizada"); }
function go(g){
  if(g.tab==="resumos"){ if(g.tp){ openTp=g.tp; resFilter="all"; onlyMnem=false; } if(g.mnem){ onlyMnem=true; } }
  if(g.tab==="simulados"){
    if(g.simDia){ const s=simOfDay(g.simDia); const tps=D.topicos.filter(t=>dayOfTopic(t.id)<=g.simDia).map(t=>t.id);
      startSimCfg({nome:s.nome, qs:pickQuestions(s.n, s.full?D.topicos.map(t=>t.id):tps, {prop:true}), mode:"prova", limitMin:s.min, full:!!s.full, taskId:taskIdFor(g.simDia,/^Simulado/)}); }
    else if(g.diag){ startSimCfg({nome:"Diagnóstico", qs:pickQuestions(10, D.topicos.map(t=>t.id), {prop:true}), mode:"treino", taskId:taskIdFor(START,/Diagnóstico/)}); }
    else if(g.treinoDia){ const day=T.day[g.treinoDia]; startSimCfg({nome:"Treino do dia", qs:pickQuestions(10, day.tps), mode:"treino", taskId:"q:"+g.treinoDia}); }
    else if(g.erros){ const e=shuffle(errosList()).slice(0,30); if(e.length) startSimCfg({nome:"Caderno de erros", qs:e, mode:"treino"}); }
  }
  showTab(g.tab); window.scrollTo(0,0);
}
function startSimCfg(cfg){ SIM=Object.assign({ans:{}, idx:0, start:Date.now(), done:false, revealed:{}}, cfg); }
function taskIdFor(d, re){ const day=T.day[d]; if(!day) return null; const i=day.extra.findIndex(x=>re.test(x)); return i<0?null:"x"+i+":"+d; }

// ---------- eventos ----------
document.addEventListener("click", e=>{
  const tab=e.target.closest("nav.tabs button"); if(tab){ showTab(tab.dataset.tab); return; }
  const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); go(JSON.parse(g.dataset.go)); return; }
  const id=e.target.id;
  if(id==="prevDay"||id==="nextDay"){ const i=D.crono.findIndex(d=>d.d===viewDay)+(id==="prevDay"?-1:1); viewDay=D.crono[Math.max(0,Math.min(D.crono.length-1,i))].d; renderHoje(); return; }
  if(id==="backToday"){ viewDay=curDay(); renderHoje(); return; }
  const cell=e.target.closest("[data-day]"); if(cell){ viewDay=cell.dataset.day; showTab("hoje"); window.scrollTo(0,0); return; }
  // flashcards
  if(e.target.closest("#fcard")||id==="flipBtn"){ fflip=!fflip; renderFlash(); return; }
  const rt=e.target.closest("[data-rate]"); if(rt){ const r=+rt.dataset.rate; rateCard(fcur,r); fq.shift(); if(r===0) fq.push(fcur); fdone++; fflip=false; renderFlash(); return; }
  // simulados
  const sd=e.target.closest("[data-sim]"); if(sd){ go({tab:"simulados",simDia:sd.dataset.sim}); return; }
  if(e.target.closest("[data-diag]")){ go({tab:"simulados",diag:true}); return; }
  if(id==="trGo"){ const m=$("#trMat").value, tp=$("#trTp").value, n=+$("#trN").value; let tps;
    if(tp!=="all") tps=[tp]; else tps=(S.liberarTudo?D.topicos.map(t=>t.id):unlockedTopics()).filter(x=>m==="all"||matOf(x)===m);
    if(!tps.length) tps=D.topicos.filter(t=>m==="all"||t.m===m).map(t=>t.id);
    startSim({nome:"Treino rápido", qs:pickQuestions(n,tps), mode:"treino"}); return; }
  if(id==="errGo"){ go({tab:"simulados",erros:true}); return; }
  const al=e.target.closest("[data-alt]"); if(al&&SIM&&!SIM.done){ SIM.ans[SIM.qs[SIM.idx]]=+al.dataset.alt; renderSim(); return; }
  if(id==="qCheck"){ const qid=SIM.qs[SIM.idx]; SIM.revealed[qid]=true; recordAnswer(qid, SIM.ans[qid]); touch(); renderSim(); return; }
  if(id==="qPrev"){ SIM.idx--; renderSim(); return; }
  if(id==="qNext"){ SIM.idx++; renderSim(); return; }
  const jp=e.target.closest("[data-jump]"); if(jp){ SIM.idx=+jp.dataset.jump; renderSim(); return; }
  if(id==="qEnd"||id==="qEnd2"){ if(SIM.mode==="treino"){ SIM.qs.forEach(q=>{ if(SIM.ans[q]!==undefined && !SIM.revealed[q]){ SIM.revealed[q]=true; recordAnswer(q,SIM.ans[q]); } }); } finishSim(); return; }
  if(id==="qQuit"){ if(e.target.dataset.armed){ SIM=null; renderSim(); } else { e.target.dataset.armed="1"; e.target.textContent="Toque de novo para sair"; } return; }
  if(id==="simBack"){ SIM=null; renderSim(); return; }
  // resumos
  const fl=e.target.closest("[data-filter]"); if(fl){ resFilter=fl.dataset.filter; renderResumos(); return; }
  if(e.target.classList.contains("blank")){ e.target.classList.toggle("show"); return; }
  const ld=e.target.closest("[data-lido]"); if(ld){ const t=ld.dataset.lido; S.lido[t]=!S.lido[t]; S.tasks["r:"+t]=S.lido[t]; openTp=null; touch(); const op=$("#tp-"+t); renderResumos(); const n=$("#tp-"+t); if(n&&op) n.open=true; toast(S.lido[t]?"Tópico marcado como estudado":"Marcação removida"); return; }
  const tr=e.target.closest("[data-treino]"); if(tr){ startSimCfg({nome:"Treino: "+T.top[tr.dataset.treino].t, qs:pickQuestions(10,[tr.dataset.treino]), mode:"treino"}); showTab("simulados"); window.scrollTo(0,0); return; }
  // redação
  if(id==="redTime"){ if(redTimer){ clearInterval(redTimer); redTimer=null; e.target.textContent="Iniciar 50 min"; } else { redStart=Date.now(); e.target.textContent="Parar"; redTimer=setInterval(()=>{ const c=$("#redClock"); const left=Math.max(0,3000000-(Date.now()-redStart)); if(c) c.textContent=pad(Math.floor(left/60000))+":"+pad(Math.floor(left%60000/1000)); if(!left){ clearInterval(redTimer); redTimer=null; toast("50 minutos: hora de passar a limpo"); } },1000); } return; }
  if(id==="redSave"){ const txt=$("#redText").value; if(!txt.trim()){ toast("Escreva o texto antes de salvar"); return; } let nota=0; for(let i=0;i<4;i++) nota+=+$("#sr"+i).value;
    S.redacoes.push({date:todayISO(), tema:redTema, linhas:countLines(txt), nota, texto:txt.slice(0,4000)}); if(S.redacoes.length>12) S.redacoes.shift(); S.redDraft=""; touch(); renderRedacao(); toast("Redação salva"); return; }
  // backup
  if(id==="bkCopy"){ const ta=$("#bkOut"); navigator.clipboard.writeText(ta.value).then(()=>toast("Código copiado")).catch(()=>{ ta.select(); toast("Selecionado: copie com Ctrl+C"); }); return; }
  if(id==="bkLoad"){ try{ const o=JSON.parse($("#bkIn").value); if(!o||typeof o!=="object"||!o.cards) throw 0; S=Object.assign(blankState(),o); S.updatedAt=Date.now(); touch(); renderDesemp(); toast("Progresso restaurado"); }catch(err){ $("#bkMsg").textContent="Código inválido: cole o texto completo copiado do backup."; } return; }
  if(id==="bkReset"){ if(e.target.dataset.armed){ S=blankState(); S.updatedAt=Date.now(); touch(); fq=null; renderDesemp(); toast("Progresso zerado"); } else { e.target.dataset.armed="1"; e.target.textContent="Toque de novo para confirmar"; } return; }
});
document.addEventListener("change", e=>{
  if(e.target.dataset.task){ S.tasks[e.target.dataset.task]=e.target.checked; const t=e.target.dataset.task; if(t.startsWith("r:")) S.lido[t.slice(2)]=e.target.checked; touch(); renderHoje(); return; }
  if(e.target.id==="libAll"){ S.liberarTudo=e.target.checked; fq=null; touch(); renderFlash(); return; }
  if(e.target.id==="onlyMnem"){ onlyMnem=e.target.checked; renderResumos(); return; }
  if(e.target.id==="redTema"){ S.redDraft=$("#redText").value; redTema=+e.target.value; renderRedacao(); return; }

let draftT=null;
document.addEventListener("input", e=>{
  if(e.target.id==="redText"||/^sr\d$/.test(e.target.id)){ updRed(); if(e.target.id==="redText"){ clearTimeout(draftT); draftT=setTimeout(()=>{ S.redDraft=e.target.value; touch(); },2000); } }
});
document.addEventListener("keydown", e=>{
  if(curTab!=="flashcards"||!fcur||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(e.code==="Space"){ e.preventDefault(); fflip=!fflip; renderFlash(); }
  if(fflip && ["1","2","3","4"].includes(e.key)){ const b=document.querySelector('[data-rate="'+(+e.key-1)+'"]'); if(b) b.click(); }
});

// ---------- início ----------
async function init(){
  try{
    const r=await fetch("dados.json"); D=await r.json();
  }catch(e){ $("#tab-hoje").innerHTML='<div class="panel empty">Não foi possível carregar o conteúdo. Recarregue a página.</div>'; return; }
  T.top={}; D.topicos.forEach(t=>T.top[t.id]=t);
  T.q={}; D.questoes.forEach(q=>T.q[q.id]=q);
  T.day={}; T.topDay={}; D.crono.forEach(d=>{ T.day[d.d]=d; d.tps.forEach(tp=>T.topDay[tp]=d.d); });
  S=Object.assign(blankState(), loadLocal()||{});
  let tab="hoje"; try{ tab=localStorage.getItem(LS_KEY+"-tab")||"hoje"; }catch(e){}
  if(!document.getElementById("tab-"+tab)) tab="hoje";
  setSync("Salvo neste navegador");
  showTab(tab); updCount();
  connectRemote();
}
init();
})();
</script>
